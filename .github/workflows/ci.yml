name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages are consumed through their `dist/` (package.json
      # `types`/`exports`), which is gitignored — so on a fresh checkout every
      # consumer fails to resolve `@archi/*` until the libraries are built.
      # Only `packages/*` is needed: the apps are consumers, not dependencies,
      # and building them here would pull the embedding model and the Astro
      # site for no typecheck benefit.
      - name: Build workspace packages
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
